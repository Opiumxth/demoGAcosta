:root{
  --crema:#FDFAF4; --crema-2:#F6F0E4; --marmol:#ECEEED; --marmol-2:#F3F3F1;
  --tinta:#1A1613; --tinta-2:#2B2520; --suave:#5E554B; --linea:#E6DECE;
  --oro:#EFB428; --oro-2:#E3A416; --oro-suave:#FBEFC9; --cafe:#7A5B17;
  --ok:#2F6B45; --ok-bg:#E3F1E7; --alerta:#A3302A; --alerta-bg:#FBE8E5; --espera:#865600; --espera-bg:#FDEED0; --info:#3B4A63; --info-bg:#E9EDF4;
  --f-display:"Cormorant Garamond",Georgia,"Times New Roman",serif;
  --f-body:"Jost","Segoe UI",system-ui,-apple-system,sans-serif;
  --r-xl:34px; --r-l:26px; --r-m:18px; --r-s:12px;
  color-scheme:light;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--crema);color:var(--tinta);font:400 1.0625rem/1.6 var(--f-body);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
h1,h2,h3,h4{font-family:var(--f-display);font-weight:600;margin:0;line-height:1.02;letter-spacing:-.005em;text-wrap:balance}
p{margin:0} ul{margin:0;padding:0;list-style:none} a{color:inherit} img{display:block;max-width:100%}
button,input,select,textarea{font:inherit;color:inherit} button{cursor:pointer}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--tinta);outline-offset:3px;border-radius:6px}
.ic{width:1.25em;height:1.25em;flex:none}
.wrap{width:100%;max-width:1180px;margin:0 auto;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px))}
.eyebrow{font-size:.78rem;font-weight:500;letter-spacing:.22em;text-transform:uppercase;color:var(--cafe)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.6em;border:1.5px solid var(--tinta);background:var(--tinta);color:var(--crema);padding:.85em 1.5em;border-radius:999px;font-weight:500;font-size:1rem;letter-spacing:.01em;text-decoration:none;transition:background .15s,transform .15s}
.btn:hover{background:var(--tinta-2)} .btn:active{transform:translateY(1px)}
.btn.oro{background:var(--oro);border-color:var(--oro);color:var(--tinta)} .btn.oro:hover{background:var(--oro-2);border-color:var(--oro-2)}
.btn.ghost{background:transparent;color:var(--tinta)} .btn.ghost:hover{background:var(--marmol)}
.btn.sm{padding:.55em 1.05em;font-size:.92rem}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:.45em;padding:.3em .85em;border-radius:999px;font-size:.84rem;font-weight:500;background:var(--marmol);color:var(--tinta)}
.chip.ok{background:var(--ok-bg);color:var(--ok)} .chip.warn{background:var(--espera-bg);color:var(--espera)} .chip.bad{background:var(--alerta-bg);color:var(--alerta)} .chip.info{background:var(--info-bg);color:var(--info)} .chip.oro{background:var(--oro-suave);color:var(--cafe)}

/* barra de demo */
.demo-bar{background:var(--tinta);color:#EDE6D8;font-size:.86rem}
.demo-bar .wrap{display:flex;align-items:center;justify-content:space-between;gap:14px;padding-top:9px;padding-bottom:9px}
.seg{display:inline-flex;background:#3A332C;border-radius:999px;padding:3px;flex:none}
.seg button{border:0;background:transparent;color:#EDE6D8;padding:.35em 1em;border-radius:999px;font-size:.86rem;font-weight:500}
.seg button[aria-pressed="true"]{background:var(--crema);color:var(--tinta)}

/* cabecera del sitio */
.hdr{position:sticky;top:0;z-index:20;background:rgba(253,250,244,.94);backdrop-filter:saturate(1.4) blur(8px);border-bottom:1px solid var(--linea)}
.hdr .wrap{display:flex;align-items:center;gap:20px;min-height:74px}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;flex:none}
.brand img{width:46px;height:46px;border-radius:50%;border:1px solid var(--linea)}
.brand b{display:block;font-family:var(--f-display);font-weight:600;font-size:1.55rem;letter-spacing:.06em;line-height:1}
.brand small{display:block;font-size:.62rem;letter-spacing:.26em;text-transform:uppercase;color:var(--cafe);margin-top:3px}
.nav{display:flex;align-items:center;gap:4px;margin-left:auto}
.nav a{padding:.5em .9em;border-radius:999px;text-decoration:none;font-weight:500;font-size:.98rem;color:var(--tinta);display:inline-flex;align-items:center;gap:.4em}
.nav a:hover{background:var(--marmol)} .nav a.on{background:var(--marmol)}
.nav .dot{width:7px;height:7px;border-radius:50%;background:var(--oro)}
.nav a.btn{margin-left:8px;color:var(--crema)}.nav a.btn:hover{background:var(--tinta-2)}
.menu-btn{display:none;margin-left:auto;border:1.5px solid var(--tinta);background:transparent;border-radius:999px;padding:.5em .9em;font-weight:500;align-items:center;gap:.5em}
.aviso{background:var(--oro);color:var(--tinta);font-weight:500;font-size:.96rem}
.aviso .wrap{display:flex;gap:10px;align-items:center;justify-content:center;padding-top:9px;padding-bottom:9px;text-align:center}

/* portada */
.hero{position:relative;overflow:hidden;background:
  radial-gradient(900px 520px at 85% 10%,rgba(236,238,237,.95),transparent 70%),
  radial-gradient(700px 400px at 0% 100%,rgba(246,240,228,.9),transparent 70%),var(--crema)}
.hero .vena{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;opacity:.7}
.hero .wrap{position:relative;display:grid;grid-template-columns:1.05fr .95fr;gap:36px;align-items:center;padding-top:56px;padding-bottom:72px}
.hero h1{font-size:clamp(2.9rem,6.4vw,5.6rem);margin:16px 0 20px}
.hero h1 em{font-style:italic;font-weight:500}
.hero .lead{font-size:1.2rem;color:var(--suave);max-width:30em}
.hero .acts{display:flex;flex-wrap:wrap;gap:12px;margin-top:28px}
.hero .meta{display:flex;flex-wrap:wrap;gap:10px;margin-top:26px}
.arco{position:relative;justify-self:center;width:min(100%,400px)}
.arco .foto{aspect-ratio:4/5;border-radius:999px 999px 28px 28px;overflow:hidden;background:var(--marmol);box-shadow:0 30px 60px -30px rgba(26,22,19,.45)}
.arco .foto img{width:100%;height:100%;object-fit:cover}
.sello{position:absolute;left:-34px;bottom:30px;width:158px;height:158px;border-radius:50%;background:var(--oro);display:grid;place-content:center;text-align:center;transform:rotate(-8deg);box-shadow:0 16px 30px -14px rgba(122,91,23,.7);padding:10px}
.sello small{display:block;font-size:.68rem;letter-spacing:.28em;text-transform:uppercase;font-weight:600}
.sello b{display:block;font-family:var(--f-body);font-weight:800;font-size:2.7rem;line-height:1;letter-spacing:-.02em;font-style:italic}
.sello span{display:block;font-size:.7rem;font-weight:500;line-height:1.2;margin-top:4px}

/* secciones */
.sec{padding:76px 0}
.sec h2{font-size:clamp(2.1rem,4vw,3.3rem);margin:10px 0 12px}
.sec .sub{color:var(--suave);max-width:36em;font-size:1.1rem}
.grid-serv{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-top:34px}.serv .pre{font-weight:600;color:var(--cafe);font-size:.95rem}.centro{display:flex;justify-content:center;margin-top:32px}
.serv{display:flex;flex-direction:column;gap:10px;padding:26px 24px;border-radius:var(--r-l);background:var(--crema-2);border:1px solid var(--linea);text-decoration:none;transition:transform .18s,border-color .18s,background .18s;min-width:0}
.serv:hover{transform:translateY(-3px);border-color:var(--oro);background:#FFF9EC}
.serv .ico{width:50px;height:50px;border-radius:50%;background:var(--oro);display:grid;place-items:center;font-size:1.3rem}
.serv h3{font-size:1.65rem;margin-top:6px} .serv p{color:var(--suave);font-size:1rem}
.serv .mas{margin-top:auto;padding-top:6px;font-weight:500;display:inline-flex;align-items:center;gap:.35em;font-size:.96rem}
.sec.oscura{background:var(--tinta);color:var(--crema)}
.sec.oscura .eyebrow{color:var(--oro)} .sec.oscura .sub{color:#CFC6B6}
.promos{display:grid;gap:22px;margin-top:34px}
.promo-img{display:grid;grid-template-columns:minmax(0,320px) 1fr;gap:28px;align-items:center}
.promo-img img{width:100%;border-radius:var(--r-m);box-shadow:0 24px 50px -26px #000}
.ticket{position:relative;display:grid;grid-template-columns:minmax(150px,200px) 1fr;background:var(--crema);color:var(--tinta);border-radius:var(--r-l);overflow:hidden;min-width:0}
.ticket .tv{background:var(--oro);padding:26px 18px;display:grid;place-content:center;text-align:center;border-right:2px dashed rgba(26,22,19,.35)}
.ticket .tv small{font-size:.7rem;letter-spacing:.28em;text-transform:uppercase;font-weight:600;display:block;min-height:1em}
.ticket .tv b{font-family:var(--f-body);font-weight:800;font-size:clamp(2.2rem,5vw,3rem);line-height:1.05;letter-spacing:-.02em;overflow-wrap:anywhere}
.ticket .tb{padding:24px 26px;display:flex;flex-direction:column;gap:10px;min-width:0}
.ticket h3{font-size:1.75rem}
.ticket li{display:flex;gap:.55em;align-items:flex-start;color:var(--suave);font-size:.98rem} .ticket li .ic{color:var(--cafe);margin-top:.25em}
.ticket .fila{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.ticket.compact{grid-template-columns:1fr}.ticket.compact .tv{border-right:0;border-bottom:2px dashed rgba(26,22,19,.35);padding:16px}.ticket.compact h3{font-size:1.5rem}
.pasos{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:34px;counter-reset:p}
.paso{padding:26px;border-radius:var(--r-l);background:var(--crema-2);border:1px solid var(--linea)}
.paso b{display:grid;place-items:center;width:44px;height:44px;border-radius:50%;background:var(--tinta);color:var(--crema);font-family:var(--f-display);font-size:1.5rem}
.paso h3{font-size:1.5rem;margin:14px 0 6px} .paso p{color:var(--suave)}
.dos{display:grid;grid-template-columns:1fr 1fr;gap:48px;align-items:center}
.fotos{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:end}
.fotos img{width:100%;object-fit:cover;border-radius:var(--r-l);box-shadow:0 20px 40px -26px rgba(26,22,19,.5)}

.main{padding:34px 36px 80px;min-width:0}

button.it:hover{border-color:var(--tinta)}

.cc.por{background:var(--espera-bg);border-color:#EBCB91}.cc.ate{background:var(--ok-bg);border-color:#BFDCC8}.cc.can{opacity:.5;text-decoration:line-through}
.leyenda{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}

/* modal y aviso */

/* páginas internas del sitio */
.pgh{background:radial-gradient(800px 380px at 92% 0%,rgba(236,238,237,.95),transparent 70%),var(--crema);border-bottom:1px solid var(--linea)}
.pgh .wrap{padding-bottom:46px}
.pgh .eyebrow{margin-top:20px}
.pgh h1{font-size:clamp(2.4rem,5.2vw,4.2rem);margin:12px 0 14px;max-width:16em}
.pgh .lead{font-size:1.18rem;color:var(--suave);max-width:38em}
.pgh .acts{display:flex;flex-wrap:wrap;gap:12px;margin-top:24px}
.grupo{padding:46px 0 8px;border-top:1px solid var(--linea)}
.grupo:first-child{border-top:0}
.grupo h2{font-size:clamp(1.8rem,3.2vw,2.5rem);margin:6px 0 6px}
.grupo .sub{color:var(--suave);max-width:36em}
.grid-serv.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.vals{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-top:26px}
.val{padding:24px;border-radius:var(--r-l);background:var(--crema-2);border:1px solid var(--linea);min-width:0}
.val h3{font-size:1.45rem;margin:10px 0 6px}.val p{color:var(--suave)}
.datos{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-top:26px}
.datos div{padding:20px 22px;border-radius:var(--r-m);background:#fff;border:1px solid var(--linea)}
.datos small{display:block;font-size:.78rem;letter-spacing:.18em;text-transform:uppercase;color:var(--cafe);font-weight:500}
.datos b{display:block;font-family:var(--f-display);font-size:1.7rem;font-weight:600;margin-top:4px;line-height:1.1}
.pie-nav{display:flex;flex-wrap:wrap;gap:6px 18px;width:100%;padding-bottom:14px;border-bottom:1px solid #3A332C}
.pie-nav a{color:#EDE6D8;text-decoration:none;font-weight:500}
.pie-nav a:hover{text-decoration:underline}
.pie .wrap{align-items:flex-start}
select.sel{appearance:auto}
@media (max-width:980px){.vals,.datos{grid-template-columns:1fr}.grid-serv.g3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.pgh .wrap{padding-bottom:30px}.pgh h1{font-size:clamp(2.2rem,10.5vw,3rem)}.pgh .lead{font-size:1.08rem}.val{padding:16px 18px}.grupo{padding-top:32px}}

function slotsDe(d){const h=[];for(let i=(d.getDay()===0?11:10);i<=20;i++)h.push(pad(i)+':00');return h;}

}
function slotsLibres(d){const ah=new Date();const esHoy=iso(d)===iso(ah);return slotsDe(d).filter(h=>!esHoy||Number(h.slice(0,2))>ah.getHours());}
function diasReserva(){const hoy=new Date();hoy.setHours(0,0,0,0);const o=[];for(let i=0;i<15;i++){const d=addDays(hoy,i);if(cerrado(d))continue;if(i===0&&slotsLibres(d).length===0)continue;o.push({d:d,i:i});}return o;}

function chipEstado(e){return e==='por-confirmar'?'<span class="chip warn">Por confirmar</span>':e==='atendida'?'<span class="chip ok">Atendida</span>':e==='cancelada'?'<span class="chip bad">Cancelada</span>':'<span class="chip info">Confirmada</span>';}

  return '<div class="ph1"><div><h1>Respuestas rápidas</h1><p>Mensajes listos para copiar y pegar en WhatsApp.</p></div></div><div class="resp">'+RESP.map((r,i)=>'<div class="it"><span class="tx"><b>'+esc(r[0])+'</b><span>'+esc(r[1])+'</span></span><button class="btn ghost sm" type="button" data-act="copiar-resp" data-id="'+i+'">'+ic('copy')+'Copiar</button></div>').join('')+'</div><p class="dem">Los textos finales los define G·Acosta.</p>';

function resumenHTML(){
  const fin=iso(addDays(S.base,6)),sem=S.citas.filter(c=>c.fecha>=iso(S.base)&&c.fecha<=fin&&c.estado!=='cancelada');
  const web=sem.filter(c=>c.origen==='web').length,pc=porConfirmar().length,rc=S.rec.filter(r=>!r.enviado&&recEstado(r)[2]<=2).length;
  const cnt={};sem.forEach(c=>{cnt[c.servicio]=(cnt[c.servicio]||0)+1;});
  const top=Object.keys(cnt).map(k=>[k,cnt[k]]).sort((a,b)=>b[1]-a[1]).slice(0,6),mx=top.length?top[0][1]:1;
  const org={web:0,whatsapp:0,mostrador:0};sem.forEach(c=>{org[c.origen]++;});
  return '<div class="ph1"><div><h1>Resumen</h1><p>Próximos 7 días, con datos de ejemplo.</p></div></div><div class="stats"><div class="stat"><b>'+sem.length+'</b><span>citas en la semana</span></div><div class="stat"><b>'+pc+'</b><span>por confirmar</span></div><div class="stat"><b>'+web+'</b><span>llegaron por la web</span></div><div class="stat"><b>'+rc+'</b><span>retoques por avisar</span></div></div>'+
  '<div class="col2"><div class="pc"><h2>Servicios más pedidos</h2>'+top.map(t=>'<div class="barra"><span>'+esc(t[0])+'</span><div><i style="width:'+Math.round(t[1]/mx*100)+'%"></i></div><b>'+t[1]+'</b></div>').join('')+'</div>'+
  '<div class="pc"><h2>Cómo llegan las citas</h2>'+[['web','Web'],['whatsapp','WhatsApp'],['mostrador','En el local']].map(k=>'<div class="barra"><span>'+k[1]+'</span><div><i style="width:'+Math.round(org[k[0]]/Math.max(1,sem.length)*100)+'%"></i></div><b>'+org[k[0]]+'</b></div>').join('')+'<p class="dem">Con esto sabes de dónde vienen tus clientas y qué servicios mover.</p></div></div>';
}
function panelHTML(){

  document.querySelectorAll('.seg button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.v===vista)));
  const fab=$('#fab');fab.hidden=vista==='panel'||h==='reservar';fab.innerHTML=ic('layout-dashboard')+'<span>Ver el panel del salón</span>';
  if(vista==='panel'){const t=h.split('-')[1];if(t&&TABS.some(x=>x[0]===t))S.tab=t;}
  $('#app').innerHTML=vistaHTML(h);
  setSeo(h);
  window.scrollTo(0,0);
}
function refrescar(){const y=window.scrollY;$('#app').innerHTML=vistaHTML(ruta());window.scrollTo(0,y);}
function pageHTML(){return vistaHTML(ruta());}
function irPanel(t){S.tab=t||S.tab;const dest='#panel-'+S.tab;if(location.hash===dest)render();else location.hash=dest;}

document.addEventListener('click',function(e){
  const t=e.target.closest('[data-act]');if(!t)return;
  const a=t.dataset.act,v=t.dataset.v,id=t.dataset.id?Number(t.dataset.id):null;
  if(a==='cerrar-mo'){if(t.classList.contains('mo')&&e.target!==t)return;modal('');return;}
  if(a==='vista'){if(v==='sitio'){location.hash='#inicio';}else{irPanel(S.tab);}return;}
  if(a==='menu'){const h=$('#hdr');h.classList.toggle('abierto');return;}
  if(a==='wa'){toast('En la demo no se abre WhatsApp. En la web real abre el chat con el número del salón ('+NEG.cel+').');return;}
  if(a==='reservar-serv'){book.servicio=v;book.tipo='';location.hash='#reservar';return;}
  if(a==='reservar-item'){const sv=sBy(t.dataset.s);if(sv){book.servicio=sv.n;book.tipo=String(t.dataset.i);}location.hash='#reservar';return;}
  if(a==='tipo'){book.tipo=book.tipo===v?'':v;refrescar();return;}
  if(a==='goto'){const el=document.getElementById(v);if(el)el.scrollIntoView({behavior:'smooth',block:'start'});return;}
  if(a==='toggle-item'){const k=t.dataset.k;S.off[k]=!S.off[k];refrescar();return;}
  if(a==='ptabsv'){S.psv=v;refrescar();return;}
  if(a==='ver-precios'){location.hash='#precios';return;}
  if(a==='dia'){book.dia=v;if(book.hora&&S.citas.some(c=>c.estado!=='cancelada'&&c.fecha===v&&c.hora===book.hora))book.hora='';if(slotsDe(parseISO(v)).indexOf(book.hora)<0)book.hora='';refrescar();return;}
  if(a==='hora'){book.hora=v;refrescar();return;}
  if(a==='enviar'){
    const er=$('#err');const falta=!book.servicio?'Elige un servicio.':!book.dia?'Elige un día.':!book.hora?'Elige una hora.':!book.nombre.trim()?'Escribe tu nombre.':'';
    if(falta){er.textContent=falta;er.hidden=false;return;}
    const ts=tipoSel();const c={id:S.nid++,fecha:book.dia,hora:book.hora,cliente:book.nombre.trim(),cel:book.cel||'Sin número',servicio:book.servicio,det:ts?ts.it.n:'',origen:'web',estado:'por-confirmar'};
    S.citas.push(c);book.msg=msgReserva();book.ok=c;refrescar();window.scrollTo(0,0);return;}
  if(a==='otra'){book=newBook();refrescar();return;}
  if(a==='ver-panel-cita'){S.logged=true;S.tab='hoy';location.hash='#panel-hoy';return;}
  if(a==='tab'){irPanel(v);return;}
  if(a==='salir'){S.logged=false;location.hash='#panel';render();return;}
  if(a==='reset'){S=seed();book=newBook();S.logged=true;render();toast('Demo restablecida.');return;}
  if(a==='cita'){const c=S.citas.find(x=>x.id===id);if(c)mCita(c);return;}
  if(a==='confirmar'){const c=S.citas.find(x=>x.id===id);if(c){c.estado='confirmada';modal('');refrescar();toast('Cita confirmada. En la versión real se abre WhatsApp con el mensaje.');}return;}
  if(a==='atender'){const c=S.citas.find(x=>x.id===id);if(c){c.estado='atendida';modal('');refrescar();}return;}
  if(a==='cancelar'){const c=S.citas.find(x=>x.id===id);if(c){c.estado='cancelada';modal('');refrescar();toast('Cita cancelada. La hora vuelve a quedar libre en la web.');}return;}
  if(a==='copiar-mt'){const ta=$('#mt');copiar(ta?ta.value:'',ta);return;}
  if(a==='recordar'){const r=S.rec.find(x=>x.id===id);if(r)mRec(r);return;}
  if(a==='enviado'){const r=S.rec.find(x=>x.id===id);if(r){r.enviado=true;modal('');refrescar();toast('Recordatorio marcado como enviado.');}return;}
  if(a==='ptab'){S.ptab=v;refrescar();return;}
  if(a==='nueva'){mNuevaCita();return;}
  if(a==='guardar-cita'){const n=$('#n1').value.trim();if(!n){const er=$('#nerr');er.textContent='Escribe el nombre de la clienta.';er.hidden=false;return;}
    const f=$('#n3').value,h=$('#n4').value;if(S.citas.some(c=>c.estado!=='cancelada'&&c.fecha===f&&c.hora===h)){const er=$('#nerr');er.textContent='Esa hora ya está ocupada. Elige otra.';er.hidden=false;return;}
    S.citas.push({id:S.nid++,fecha:f,hora:h,cliente:n,cel:'999 000 000',servicio:$('#n2').value,origen:'mostrador',estado:'confirmada'});modal('');refrescar();toast('Cita guardada.');return;}
  if(a==='nuevo-rec'){mNuevoRec();return;}
  if(a==='guardar-rec'){const n=$('#r1').value.trim(),s=$('#r2').value.trim(),f=$('#r3').value;if(!n||!s||!f){const er=$('#rerr');er.textContent='Completa clienta, servicio y fecha.';er.hidden=false;return;}
    S.rec.push({id:S.nid++,cliente:n,cel:'999 000 000',servicio:s,fecha:f,enviado:false});modal('');refrescar();toast('Recordatorio guardado.');return;}
  if(a==='aviso'){S.aviso.on=!S.aviso.on;refrescar();return;}
  if(a==='pausar'){const p=S.promos.find(x=>x.id===id);if(p){p.activa=!p.activa;if(p.activa&&p.hasta&&p.hasta<Date.now())toast('Esa promoción ya terminó: edítala para cambiar la fecha.');refrescar();}return;}
  if(a==='nueva-promo'){mPromo(null);return;}
  if(a==='editar-promo'){mPromo(S.promos.find(x=>x.id===id));return;}
  if(a==='borrar-promo'){S.promos=S.promos.filter(x=>x.id!==id);refrescar();toast('Promoción eliminada. Ya no se ve en la web.');return;}
  if(a==='guardar-promo'){const val=$('#p2').value.trim(),tx=$('#p3').value.trim();if(!val||!tx){const er=$('#perr');er.textContent='Escribe el valor y el texto de la promoción.';er.hidden=false;return;}
    const det=$('#p4').value.split('\n').map(s=>s.trim()).filter(Boolean),f=$('#p5').value;let hasta=null;if(f){const d=parseISO(f);d.setHours(18,0,0,0);hasta=d.getTime();}
    const ex=S.promos.find(x=>x.id===id);
    if(ex){ex.pre=$('#p1').value.trim();ex.valor=val;ex.texto=tx;ex.det=det.length?det:ex.det;ex.hasta=hasta;}
    else S.promos.unshift({id:S.nid++,pre:$('#p1').value.trim(),valor:val,texto:tx,det:det.length?det:['Consulta condiciones en el salón'],hasta:hasta,dias:null,activa:true,real:true});
    modal('');refrescar();toast('Promoción guardada. Ya se ve en la web.');return;}
  if(a==='copiar-resp'){const r=RESP[id];if(r){const tmp=document.createElement('textarea');tmp.value=r[1];tmp.style.position='fixed';tmp.style.opacity='0';document.body.appendChild(tmp);copiar(r[1],tmp);setTimeout(()=>tmp.remove(),50);}return;}
});
document.addEventListener('input',function(e){
  const f=e.target.dataset.f;
  if(f){book[f]=e.target.value;const m=$('#msg');if(m)m.textContent=msgReserva();}
  if(e.target.dataset.f3){S.px[e.target.dataset.f3]=e.target.value;}
  if(e.target.dataset.f2==='aviso'){S.aviso.texto=e.target.value;const p=$('#av-prev');if(p)p.textContent=S.aviso.on?S.aviso.texto:'Sin avisos: la web se ve normal.';}
});
document.addEventListener('change',function(e){
    const f=e.target.dataset.f;if(f==='servicio'){book.servicio=e.target.value;book.tipo='';refrescar();return;}
    const q=e.target.dataset.sel;if(!q)return;const v=e.target.value;
    const ajustaHora=()=>{if(book.hora&&(!book.dia||slotsLibres(parseISO(book.dia)).indexOf(book.hora)<0||S.citas.some(c=>c.estado!=='cancelada'&&c.fecha===book.dia&&c.hora===book.hora)))book.hora='';};
    if(q==='dia'){if(v==='__otra'){book.otra=true;book.dia='';book.hora='';}else{book.otra=false;book.dia=v;ajustaHora();}refrescar();return;}
    if(q==='fecha'){if(v&&cerrado(parseISO(v))){book.dia='';book.hora='';refrescar();const er=$('#err');if(er){er.textContent='Los lunes cerramos. Elige otro día.';er.hidden=false;}return;}book.dia=v;ajustaHora();refrescar();return;}
    if(q==='hora'){book.hora=v;refrescar();return;}
    if(q==='tipo'){book.tipo=v;refrescar();return;}
  });
document.addEventListener('submit',function(e){e.preventDefault();if(e.target.dataset.form==='login'){S.logged=true;S.tab='hoy';location.hash='#panel-hoy';render();}});
document.addEventListener('keydown',function(e){if(e.key==='Escape')modal('');});
window.addEventListener('hashchange',function(){modal('');render();});
S=seed();book=newBook();
render();
})();
</script>
</body></html>
